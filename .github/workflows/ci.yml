name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write # the test report is published as a check run

jobs:
  build-and-test:
    name: ${{ matrix.preset }}
    runs-on: windows-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        preset: [x64-Debug, x64-Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      # The tests need no GPU: they cover CPU code and shader compilation with the bundled DXC
      - name: Test
        env:
          GTEST_OUTPUT: xml:${{ github.workspace }}/test-results/
        run: ctest --test-dir out/build/${{ matrix.preset }} --output-on-failure --timeout 300

      - name: Publish test report
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v1
        with:
          name: Tests (${{ matrix.preset }})
          path: test-results/*.xml
          reporter: java-junit
          fail-on-error: false
